model_list:
  # ── llama-server (official image, currently commented out in compose)
  - model_name: qwen3.5
    litellm_params:
      model: openai/qwen3.5-9b-distilled-q5_k_m
      api_base: http://llama-server:8080/v1
      api_key: "none"
      max_tokens: 16384
      allowed_openai_params: ["presence_penalty", "temperature", "top_p"]

  # ── KoboldCpp (Elypha's hybrid-cpp fork, proper checkpoint restore)
  - model_name: qwen3.5-hybrid
    litellm_params:
      model: openai/qwen3.5-9b-distilled-q5_k_m
      api_base: http://koboldcpp:5001/v1
      api_key: "none"
      max_tokens: 16384
      temperature: 0.7
      top_p: 0.95
      presence_penalty: 0.0
      allowed_openai_params: ["presence_penalty", "temperature", "top_p", "max_tokens"]

litellm_settings:
  callbacks: ["langfuse"]
  turn_off_message_logging: false
  request_timeout: 600
  drop_params: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY