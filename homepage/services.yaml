---
- AI:
    - LibreChat:
        icon: si-openai
        href: http://localhost:18082
        description: Chat interface
        server: my-docker
        container: librechat

    - Langfuse:
        icon: si-graphql
        href: http://localhost:13000
        description: LLM observability & tracing
        server: my-docker
        container: langfuse-web

    - LiteLLM:
        icon: si-fastapi
        href: http://localhost:14000
        description: LLM proxy gateway
        server: my-docker
        container: litellm

- Automation:
    - n8n:
        icon: si-n8n
        href: http://localhost:15678
        description: Workflow automation
        server: my-docker
        container: n8n

    - Neo4j:
        icon: si-neo4j
        href: http://localhost:17474
        description: Graph database (Graphify)
        server: my-docker
        container: neo4j

    - SearXNG:
        icon: si-searxng
        href: http://localhost:18081
        description: Search engine for agents
        server: my-docker
        container: searxng

- Infrastructure:
    - llama-server:
        icon: si-ollama
        href: http://localhost:11434
        description: Local inference engine (llama.cpp)
        server: my-docker
        container: llama-server
        widget:
          type: customapi
          url: http://llama-server:8080/props
          refreshInterval: 30000
          method: GET
          mappings:
            - field: model_alias
              label: Model
              format: text
            - field: default_generation_settings.n_ctx
              label: Context
              format: text
            - field: total_slots
              label: Slots
              format: text

    - llama-server slots:
        icon: si-ollama
        href: http://localhost:11434/slots
        description: Live slot activity
        widget:
          type: customapi
          url: http://llama-server:8080/slots
          refreshInterval: 5000
          method: GET
          mappings:
            - field: 0.is_processing
              label: Slot 0
              format: text
            - field: 1.is_processing
              label: Slot 1
              format: text
            - field: 0.next_token.0.n_decoded
              label: Last tokens
              format: text