name: infrastructure-database

services:
  neo4j:
    image: neo4j:community
    container_name: neo4j
    hostname: neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_config_strict__validation_enabled: "false"

      # Enable vector index support (requires Neo4j 5.x)
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"

    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 2g    # heap 1g + pagecache 512m + JVM overhead

    # No host ports — internal only
    # Consumers reach this via neo4j:7687 (Bolt) on llm-stack

    networks:
      - llm-stack

volumes:
  neo4j-data:
    name: neo4j-data
  neo4j-logs:
    name: neo4j-logs

networks:
  llm-stack:
    external: true
    name: llm-stack