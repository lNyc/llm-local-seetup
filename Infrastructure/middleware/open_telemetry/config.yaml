receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  transform/traces:
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.operation.name"], "chat") where attributes["gen_ai.operation.name"] == "acompletion"

  transform/gpu_metrics:
    metric_statements:
      - context: metric
        statements:
          - set(name, "gpu.utilization")    where name == "hw.gpu.utilization"
          - set(name, "gpu.temperature")    where name == "hw.gpu.temperature"
          - set(name, "gpu.memory.used")    where name == "hw.gpu.memory.utilization"
          - set(name, "gpu.power.draw")     where name == "hw.gpu.power.draw"
          - set(name, "gpu.fan_speed")      where name == "hw.gpu.fan_speed"
          - set(name, "gpu.clock.graphics") where name == "hw.gpu.clock.graphics"
          - set(name, "gpu.clock.memory")   where name == "hw.gpu.clock.memory"
          - set(name, "gpu.power.limit")        where name == "hw.gpu.power.limit"

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?compress=lz4&dial_timeout=10s
    database: default
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    async_insert: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/traces, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [transform/gpu_metrics, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]